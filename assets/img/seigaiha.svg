<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20" viewBox="0 0 40 20">
  <!-- Seigaiha (blue ocean waves) pattern tile; scales are painted back-to-front -->
  <g fill="none" stroke="#c2a063" stroke-width="0.6" stroke-opacity="0.38">
    <g transform="translate(20 -10)"><circle r="20" fill="#0f0d0c"/><circle r="16"/><circle r="12"/><circle r="8"/><circle r="4"/></g>
    <g transform="translate(0 0)"><circle r="20" fill="#0f0d0c"/><circle r="16"/><circle r="12"/><circle r="8"/><circle r="4"/></g>
    <g transform="translate(40 0)"><circle r="20" fill="#0f0d0c"/><circle r="16"/><circle r="12"/><circle r="8"/><circle r="4"/></g>
    <g transform="translate(20 10)"><circle r="20" fill="#0f0d0c"/><circle r="16"/><circle r="12"/><circle r="8"/><circle r="4"/></g>
    <g transform="translate(0 20)"><circle r="20" fill="#0f0d0c"/><circle r="16"/><circle r="12"/><circle r="8"/><circle r="4"/></g>
    <g transform="translate(40 20)"><circle r="20" fill="#0f0d0c"/><circle r="16"/><circle r="12"/><circle r="8"/><circle r="4"/></g>
  </g>
</svg>
